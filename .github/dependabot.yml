version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    groups:
      go:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope
