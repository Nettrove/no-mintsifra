name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check commit subjects
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('origin/{0}..HEAD', github.base_ref) || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          case "$RANGE" in 0000000*) exit 0 ;; esac
          bad=$(git log --no-merges --format=%s "$RANGE" |
            grep -Ev '^(feat|fix|refactor|perf|test|docs|ci|build|chore)(\([a-z0-9-]+\))?!?: .{1,72}$' || true)
          [ -z "$bad" ] || { echo "Bad subjects:"; echo "$bad"; exit 1; }

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: gofmt -l . | tee /dev/stderr | (! read)
        if: runner.os == 'Linux'
      - run: go vet ./...
      - run: go test -race ./...
        env:
          CGO_ENABLED: "1"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: staticcheck
        run: |
          staticcheck ./...
          GOOS=windows staticcheck ./...
      # The release ships Windows binaries only, so that is the build to check.
      - name: govulncheck
        run: GOOS=windows govulncheck ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Cross-build the executable
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build -ldflags "-H=windowsgui" -o dist/no-mintsifra.exe ./cmd/no-mintsifra
